<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title description">
  <title id="title">laOPT modeling workflow</title>
  <desc id="description">A continuous-time optimal control problem is transcribed into a nonlinear program and passed to a numerical solver. The corresponding design choices are the modeling and automatic differentiation backend, transcription method, and solver library.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="8" refY="3" markerWidth="7" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#426a8c"/>
    </marker>
    <style>
      .heading { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #233348; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #44546a; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #36536d; }
      .choice-title { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #233348; }
      .choice-body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #44546a; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="628" rx="12" fill="#ffffff" stroke="#d8dee7" stroke-width="2"/>

  <text x="70" y="48" class="label">WORKFLOW</text>
  <text x="570" y="48" class="label">DESIGN CHOICES</text>

  <rect x="70" y="72" width="390" height="112" rx="10" fill="#eef6ff" stroke="#5d8fbd" stroke-width="2"/>
  <text x="265" y="113" text-anchor="middle" class="heading">Continuous-Time OCP</text>
  <text x="265" y="145" text-anchor="middle" class="body">Dynamics · Costs · Constraints</text>

  <line x1="265" y1="184" x2="265" y2="266" stroke="#426a8c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="180" y="202" width="170" height="34" rx="17" fill="#ffffff" stroke="#8ca1b5"/>
  <text x="265" y="225" text-anchor="middle" class="label">Transcription</text>

  <rect x="70" y="270" width="390" height="112" rx="10" fill="#f5f7fa" stroke="#7a8a9a" stroke-width="2"/>
  <text x="265" y="311" text-anchor="middle" class="heading">Mathematical Program</text>
  <text x="265" y="343" text-anchor="middle" class="body">Finite-dimensional LP, QP, or NLP</text>

  <line x1="265" y1="382" x2="265" y2="464" stroke="#426a8c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="173" y="400" width="184" height="34" rx="17" fill="#ffffff" stroke="#8ca1b5"/>
  <text x="265" y="423" text-anchor="middle" class="label">Numerical Solver</text>

  <rect x="70" y="468" width="390" height="112" rx="10" fill="#eef6ff" stroke="#5d8fbd" stroke-width="2"/>
  <text x="265" y="509" text-anchor="middle" class="heading">Callable Solver</text>
  <text x="265" y="541" text-anchor="middle" class="body">Optimized Variables and Trajectories</text>

  <rect x="570" y="72" width="320" height="112" rx="10" fill="#fff7e8" stroke="#d2a24d" stroke-width="2"/>
  <text x="730" y="108" text-anchor="middle" class="choice-title">Modeling and AD</text>
  <text x="730" y="138" text-anchor="middle" class="choice-body">ControlProblemBase</text>
  <text x="730" y="163" text-anchor="middle" class="choice-body">Eigen · CasADi</text>

  <rect x="570" y="270" width="320" height="112" rx="10" fill="#fff7e8" stroke="#d2a24d" stroke-width="2"/>
  <text x="730" y="306" text-anchor="middle" class="choice-title">Transcription Method</text>
  <text x="730" y="336" text-anchor="middle" class="choice-body">Multiple Shooting</text>
  <text x="730" y="361" text-anchor="middle" class="choice-body">Radau Collocation</text>

  <rect x="570" y="468" width="320" height="112" rx="10" fill="#fff7e8" stroke="#d2a24d" stroke-width="2"/>
  <text x="730" y="504" text-anchor="middle" class="choice-title">Solver Library</text>
  <text x="730" y="534" text-anchor="middle" class="choice-body">IPOPT · SQP</text>
  <text x="730" y="559" text-anchor="middle" class="choice-body">PIQP · OSQP · HPIPM · …</text>

  <path d="M 460 128 C 505 128, 520 128, 570 128" fill="none" stroke="#8ca1b5" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 350 219 C 490 219, 505 326, 570 326" fill="none" stroke="#8ca1b5" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 357 417 C 490 417, 505 524, 570 524" fill="none" stroke="#8ca1b5" stroke-width="2" stroke-dasharray="7 7"/>
</svg>
