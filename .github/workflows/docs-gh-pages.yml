name: Build and Deploy Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: docs
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Build documentation for validation
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Upload documentation for validation
        uses: actions/upload-artifact@v7
        with:
          name: laopt-documentation
          path: _site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Build documentation for GitHub Pages
        if: steps.pages.outcome == 'success'
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site_pages --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site_pages

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_configured == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
